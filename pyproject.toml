[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jvalyx-backend"
version = "0.1.0"
description = "Phase 1 backend for Jvalyx thermal-event intelligence replays"
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2,<2.0",
    "fastapi>=0.115,<0.122",
    "starlette>=0.40,<0.49",
    "httpx>=0.27,<1.0",
    "pydantic>=2.8,<3.0",
    "PyYAML>=6.0,<7.0",
    "uvicorn[standard]>=0.30,<1.0",
    "websockets>=12.0",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "scikit-learn>=1.3",
    "shapely>=2.0,<3.0",
    "rasterio>=1.3,<2.0",
    "qrcode[pil]>=7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["backend*"]
